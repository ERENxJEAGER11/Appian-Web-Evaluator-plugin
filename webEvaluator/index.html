<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="./webEvaluator.css">
</head>
<body>

<p id="root"></p>
<script src="APPIAN_JS_SDK_URI"></script>
<script>
const root = document.getElementById("root") || document.body;
function showMessage(msg) {
  if (root) root.textContent = msg;
  console.warn(msg);
}

// Initialize variables
let result;
let currentJavascript = ``;
let newJavascript;

// Function to execute dynamically provided JavaScript code
function executeDynamicCode(jsCode) {
  try {
    eval(jsCode);
    result = "Code executed successfully!";
  } catch (error) {
    result = "Error executing code: " + error.message;
  }
  if (root) root.innerHTML = result;
}

// Register handler once Appian SDK is available
function initAppianIntegration() {
  if (window.Appian && Appian.Component && typeof Appian.Component.onNewValue === 'function') {
    Appian.Component.onNewValue(function (newValues) {
      newJavascript = newValues.javascript;
      if (!newJavascript) {
        if (typeof Appian.Component.setValidations === 'function') {
          // setValidations may expect an array/object depending on Appian version; use array for safety
          Appian.Component.setValidations(['The JavaScript code provided is empty. Please update the parameter "javascript".']);
        } else {
          showMessage('Validation: The JavaScript code provided is empty. Please update the parameter "javascript".');
        }
      } else {
        currentJavascript = newJavascript;
        // Execute the dynamically provided code
        executeDynamicCode(currentJavascript);
      }
    });
  } else {
    showMessage('Appian SDK not detected. Replace APPIAN_JS_SDK_URI with the correct SDK URI or ensure the host injects the Appian global.');
  }
}

// If the SDK is loaded synchronously, init now; otherwise run after DOM load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initAppianIntegration);
} else {
  initAppianIntegration();
}

</script>

</body>
</html>
